<html>
    <head>
        <meta charset="UTF-8">
        <title>Metronome test</title>
        <link rel="stylesheet" href="style.css">
        <script defer src="metronome.js" ></script>
        <script defer src="timer.js"></script>
    </head>
    <body>
        <div class="metronome">
            <div class="tempoSelectorWrapper">
                <span role="button" class="tempoButtonMinus" aria-label="decrease tempo by 1" id="minusButton" tabindex="1"></span>
                <p class="tempoDisplay">40</p>
            <input type="range" min="40" max="240" value="60" id="bpmSelector" class="bpmSelector"/>
            <p class="tempoDisplay">240</p>
            <span role="button" class="tempoButtonPlus" aria-label="increase tempo by 1" id="plusButton" tabindex="1"></span>
            </div>
            <h4 id="bpmDisplay"><output name="bpm" id="bpm">60</output><span class="bpmTag">BPM</span></h4>
            <div class="controlButtonContainer">
                <button id="startButton" class="controlButton">Start</button>
                <button onClick="reset()" class="controlButton">Reset</button>
            </div>

        </div>
        <div class="timer">
            <div class="displayWrapper">
                <p class="timeDisplay" id="timeDisplay">10:00</p>
                <input type="number" step="5" id="timeInput" min="0" max="60" value="30"/>
            </div>
            <div class="timerButtonContainer">
                <button id="timerStartButton">Start</button>
                <button id="timerPauseButton">Pause</button>
                <button id="timerResetButton">Reset</button>
            </div>


        </div>
    </body>
</html>
